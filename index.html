<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Membrane Transport Lab</title>
<style>
/* ===================== 12. RESPONSIVE LAYOUT & STYLE ===================== */
:root{--bg:#bfe0fb;--bd:#26384d;--navy:#14315a;--teal:#1fa39a;--yellow:#f6d32d;--orange:#f28c28;--green:#43a047;--blue:#3fa9f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#10243d;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{display:grid;height:100vh;height:100dvh;padding:8px;gap:8px;
  grid-template-columns:240px minmax(0,1fr) 224px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head head" "left center right" "mon mon mon"}
.panel{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:8px;overflow:auto;min-height:0}
header#head{grid-area:head;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:4px 10px;min-height:46px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;color:var(--navy);min-width:160px}
.btn{min-height:40px;min-width:40px;border:1.5px solid var(--bd);border-radius:10px;background:linear-gradient(#fff,#d6e6f6);
  font:600 14px/1.1 inherit;font-family:inherit;color:#10243d;padding:0 11px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px);background:#c4daf0}
.btn.on{background:linear-gradient(#fff3b0,#ffd84d)}
.btn.sm{padding:0;min-width:40px;font-size:20px}
.btn.big{min-width:52px;min-height:52px;border-radius:26px;font-size:22px;background:linear-gradient(#7fc4ff,#2f8fe8);color:#fff;border-color:#14315a}
.btn:disabled{opacity:.4}
.seg{display:inline-flex}.seg .btn{border-radius:0;margin-left:-1.5px}.seg .btn:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg .btn:last-child{border-radius:0 10px 10px 0}
#left{grid-area:left}#center{grid-area:center;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
#right{grid-area:right;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
#monitor{grid-area:mon;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:6px 8px}
#monitor>h2{grid-column:1/-1;margin:0;font-size:13px;color:var(--navy);display:flex;justify-content:space-between}
.grp{margin:2px 0 10px}
.grp h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#1b4a7a;border-bottom:1.5px solid #cfe0f1;padding-bottom:3px}
.panel>h2{margin:0 0 6px;font-size:14px;color:var(--navy)}
.row{display:grid;grid-template-columns:64px 1fr;gap:0 10px;align-items:center;margin:10px 0}
.row .ic{grid-row:1/3;display:flex;align-items:center;justify-content:center}
.row .ic svg{width:60px;height:60px;display:block}
.row .nm{font-size:16px;font-weight:800;line-height:1.1;align-self:end;color:#10243d}
.row .ctl{grid-column:2;display:flex;align-items:center;gap:4px}
.grp.ecf{background:#e3f1fd;border:1.5px solid #8fc1ee;border-radius:10px;padding:6px 8px}.grp.cyto{background:#fff2de;border:1.5px solid #e4b777;border-radius:10px;padding:6px 8px}
.ctl input[type=range]{flex:1;width:100%;height:32px;margin:0;touch-action:pan-y;accent-color:#1b6fb5}
.grp.cyto .ctl input[type=range]{accent-color:#c77a14}
.grp{margin:2px 0 12px}
.val{flex:1;text-align:center;font-weight:700;font-size:15px;min-width:60px}
.val small{display:block;font-weight:500;font-size:10.5px;color:#4b6178}
.note{font-size:11px;color:#4b6178;margin:4px 0}
#caption{min-height:34px;background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600;color:var(--navy);display:flex;align-items:center}
#simwrap{flex:1;min-height:0;border:2px solid var(--bd);border-radius:10px;overflow:hidden;background:#d5ebfc;position:relative}
#sim{width:100%;height:100%;display:block;touch-action:none}
#status{display:flex;flex-wrap:wrap;gap:4px;min-height:0}
.chip{background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:2px 9px;font-size:12px;font-weight:600}
.chip.pump{border-color:#7b4fb0}.chip.chan{border-color:#d9930b}
#controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#controls .lab{font-size:12px;font-weight:600;color:#33506f}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed #6f9cc8;border-radius:14px;padding:14px 8px 12px;margin-bottom:8px;background:linear-gradient(#f9fcff,#e6f1fc);box-shadow:0 3px 0 #c2d6ea;touch-action:none;cursor:grab}
.tool small{font-size:14px;font-weight:700;color:#4b6178;margin-top:-6px}
#qEn,#qVi,#bSet,.seg[aria-label=Language]{display:none!important}
.tool.static b{font-size:20px}
.tool.static svg{width:100%!important;height:auto!important}
.tool.static{cursor:default;border-style:solid;border-color:#c8d8e8;box-shadow:none;touch-action:auto}
.tool svg{width:100px;height:124px;flex:none;display:block}
.tool b{font-size:22px;font-weight:800;color:var(--navy);text-align:center;line-height:1.15}
.tool .grip{position:absolute;top:9px;right:10px;width:14px;height:21px;opacity:.55;background:radial-gradient(circle,#4b6178 1.7px,transparent 2.2px) 0 0/7px 7px}
.tool:not(.static) svg{animation:nudge 2.4s ease-in-out 1.2s 2}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}60%{transform:translateX(5px)}}
.tool.static .lg{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:#33506f;align-self:stretch}
.tool.static .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.modes .btn.on{background:linear-gradient(#ffe98a,#ffc928)}
.proc{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--bd);border-radius:14px;padding:8px 10px;margin:8px 0;background:linear-gradient(#fff,#e3eefa);cursor:pointer;font:800 17px/1.15 inherit;font-family:inherit;color:#10243d;text-align:left;min-height:84px;touch-action:manipulation}
.proc svg{width:64px;height:64px;flex:none}
.proc.on{background:linear-gradient(#fff3b0,#ffd84d);box-shadow:0 0 0 3px #f2a900 inset}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;grid-column:1/-1}
.stp{display:flex;align-items:center;gap:8px;border:2px solid #c8d8e8;border-radius:12px;padding:6px 8px;font-size:14px;font-weight:700;color:#4b6178;background:#f6faff}
.stp b{flex:none;width:26px;height:26px;border-radius:50%;background:#c8d8e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.stp em{font-style:normal;color:#6a2fb0;border-bottom:3px solid #b79ae6}
.stp.on{border-color:#f2a900;background:#fff3c4;color:#10243d}.stp.on b{background:#f2a900}
.stp.done b{background:#43a047}.stp.done{color:#10243d}
#home{position:fixed;inset:0;z-index:40;background:linear-gradient(#cfe8fc,#eaf5ff);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;overflow:auto}
#home.open{display:flex}
#home h2{margin:0;font-size:30px;color:var(--navy);text-align:center}
#home .hcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:1120px}
.hcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:3px solid var(--bd);border-radius:20px;background:#fff;padding:14px 16px 18px;cursor:pointer;font-family:inherit;color:#10243d;box-shadow:0 5px 0 #9fbbd6;touch-action:manipulation}
.hcard:hover{transform:translateY(-2px)}.hcard:active{transform:translateY(2px);box-shadow:0 2px 0 #9fbbd6}
.hcard svg{width:100%;height:auto;border-radius:12px;border:1.5px solid #c8d8e8;display:block}
.hcard h3{margin:0;font-size:25px;color:var(--navy)}
.hcard ul{margin:0;padding-left:20px;font-size:16px;line-height:1.5;font-weight:600}
#homeBack{position:absolute;top:12px;right:14px}

.ghost{position:fixed;z-index:60;pointer-events:none;width:70px;height:86px;transform:translate(-50%,-50%);opacity:.92;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.card{border:1.5px solid #c8d8e8;border-radius:10px;padding:6px 8px;background:#fbfdff;min-width:0}
.card h4{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;margin:3px 0;font-size:11.5px}
.trk{height:13px;border:1px solid #8ea4bb;border-radius:7px;background:#edf3f9;overflow:hidden}
.trk i{display:block;height:100%;width:0;transition:width .15s}
.fo{background:#4aa8e8}.fi{background:#f2a33a}.fa{background:#43a047}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.sum{font-size:11.5px;color:#2a4260;line-height:1.35;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(10,30,60,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal.open{display:flex}
.dlg{background:#fff;border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:14px 16px;border:2px solid var(--bd);-webkit-user-select:text;user-select:text}
.dlg h2{margin:0 0 8px;color:var(--navy);font-size:19px;display:flex;justify-content:space-between;align-items:center}
.dlg input[type=text],.dlg textarea{font:16px system-ui,"Noto Sans",Arial,sans-serif;width:100%;border:1.5px solid #8ea4bb;border-radius:8px;padding:7px;min-height:40px}
.dlg textarea{min-height:110px;font:12px ui-monospace,Menlo,Consolas,monospace}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.terms label{font-size:12px;font-weight:600;color:#33506f;display:block}
.radios{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
details{margin:8px 0}summary{cursor:pointer;font-weight:700;min-height:32px;padding:4px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.dlg ul{margin:6px 0 6px 18px;padding:0;line-height:1.5;font-size:15px}
.obj{background:#eef7ff;border-radius:10px;padding:6px 10px;margin:8px 0}
.ch{border:1.5px solid #c8d8e8;border-radius:10px;margin-bottom:6px;background:#fbfdff}
.ch summary{padding:5px 8px;font-size:13px}
.ch .in{padding:0 8px 8px;font-size:12.5px;line-height:1.4}
.ch .opt{display:block;width:100%;text-align:left;margin:3px 0;min-height:36px;font-size:12.5px}
.ch .opt.sel{background:#ffe27a}
.ch .ok{color:#1b7a2f;font-weight:700}.ch .fb{background:#eaf7ec;border-radius:8px;padding:4px 6px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#14315a;color:#fff;padding:8px 14px;border-radius:18px;font-size:14px;z-index:70;display:none;max-width:90vw;text-align:center}
svg .halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
svg .chg{display:none}
.atp-bound{filter:drop-shadow(0 0 4px #ffd54f)}
@media (max-width:900px),(orientation:portrait){
  html,body{height:auto;overflow:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  header#head{order:1}#center{order:2}#right{order:3;flex-direction:column;overflow:visible}#left{order:4;overflow:visible}#monitor{order:5;grid-template-columns:1fr}
  #simwrap{flex:none;aspect-ratio:840/600;width:100%}
  #left .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .toolrow{display:flex;gap:8px;justify-content:center}.toolrow .tool{flex:0 1 260px;margin-bottom:0}
  #home .hcards{grid-template-columns:1fr}
  .terms{grid-template-columns:1fr}
}
#caption,#status,#home,#chalPanel{display:none!important}
.steps{grid-template-columns:repeat(3,1fr)!important}
.dirs{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;color:#33506f}.dirs .dp{color:#0b6b64}.dirs .dx{background:#ffe27a;color:#6b3f00;font-weight:800;border-radius:8px;padding:0 8px}
</style>
</head>
<body>
<div id="app">
  <header id="head">
    <h1 data-i18n="title">Membrane Transport Lab</h1>
    <div class="seg modes" role="group" aria-label="Mode">
      <button class="btn" data-m="passive" type="button" data-i18n="mPassiveS">Passive</button><button class="btn" data-m="active" type="button" data-i18n="mActiveS">Active</button><button class="btn" data-m="ves" type="button" data-i18n="mVesS">Vesicular</button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button class="btn" id="qEn" type="button">EN</button><button class="btn" id="qVi" type="button">VI</button>
    </div>
    <button class="btn" id="bSet" type="button" data-i18n="btnSettings">Settings</button>
  </header>

  <aside id="left" class="panel">
    <h2 data-i18n="solutes">Solutes</h2>
    <div class="cols" id="leftCols"></div>
  </aside>

  <main id="center">
    <div id="caption"></div>
    <div id="simwrap">
      <svg id="sim" viewBox="0 0 840 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plasma membrane simulation">
        <defs>
          <pattern id="lipOut" width="14" height="34" patternUnits="userSpaceOnUse" x="0" y="266">
            <line x1="4.5" y1="12" x2="4.5" y2="34" stroke="#e0508a" stroke-width="1.8"/>
            <line x1="9.5" y1="12" x2="9.5" y2="34" stroke="#e0508a" stroke-width="1.8"/>
            <circle cx="7" cy="7" r="6.4" fill="#f5a623" stroke="#b36b00" stroke-width="1"/>
          </pattern>
          <pattern id="lipIn" width="14" height="34" patternUnits="userSpaceOnUse" x="0" y="300">
            <line x1="4.5" y1="0" x2="4.5" y2="22" stroke="#e0508a" stroke-width="1.8"/>
            <line x1="9.5" y1="0" x2="9.5" y2="22" stroke="#e0508a" stroke-width="1.8"/>
            <circle cx="7" cy="27" r="6.4" fill="#f5a623" stroke="#b36b00" stroke-width="1"/>
          </pattern>
        </defs>
<g id="bgPA">
        <rect x="0" y="0" width="840" height="266" fill="#d5ebfc"/>
        <rect x="0" y="334" width="840" height="266" fill="#fff1dc"/>
        <rect x="0" y="266" width="840" height="68" fill="#fff0f5"/>
        <rect x="0" y="266" width="840" height="34" fill="url(#lipOut)"/>
        <rect x="0" y="300" width="840" height="34" fill="url(#lipIn)"/>
        <rect id="dropGlow" x="0" y="236" width="840" height="128" fill="#ffd84d" opacity="0" rx="8"/>
        <text class="lbl halo" x="14" y="32" font-size="24" font-weight="700" fill="#1b4a7a" data-i18n="ecf">Extracellular Fluid</text>
        <text class="lbl halo" x="14" y="586" font-size="24" font-weight="700" fill="#8a5a10" data-i18n="cyto">Cytoplasm</text>
        <text class="lbl halo" x="12" y="262" font-size="20" font-weight="700" fill="#7a2150" data-i18n="membrane">Plasma Membrane</text>
        </g>
        <g id="bgV" style="display:none">
          <rect x="0" y="0" width="840" height="600" fill="#d5ebfc"/>
          <g id="vSetA"><path class="poly" fill="#fff1dc"/><g class="rb"></g><g class="lip"><path class="tl" fill="none" stroke="#e0508a" stroke-width="1.8" stroke-linecap="round"/><path class="hd" fill="#f5a623" stroke="#b36b00" stroke-width="1"/></g></g>
          <g id="vSetB"><path class="poly" fill="#fff1dc"/><g class="rb"></g><g class="lip"><path class="tl" fill="none" stroke="#e0508a" stroke-width="1.8" stroke-linecap="round"/><path class="hd" fill="#f5a623" stroke="#b36b00" stroke-width="1"/></g></g>
          <text class="lbl halo" x="14" y="32" font-size="24" font-weight="700" fill="#1b4a7a" data-i18n="ecf">Extracellular Fluid</text>
          <text class="lbl halo" x="14" y="586" font-size="24" font-weight="700" fill="#8a5a10" data-i18n="cyto">Cytoplasm</text>
          <text class="lbl halo" x="826" y="280" text-anchor="end" font-size="20" font-weight="700" fill="#7a2150" data-i18n="bilayer">Phospholipid bilayer</text>
          <g id="vAtp" opacity="0.25" transform="translate(0 480)"><rect x="716" y="30" width="108" height="40" rx="20" fill="#fff" stroke="#16622a" stroke-width="2"/><circle cx="738" cy="50" r="9" fill="#2e9b4a" stroke="#16622a" stroke-width="1.5"/><circle cx="754" cy="50" r="5" fill="#a8e6b0" stroke="#16622a"/><text x="796" y="56" text-anchor="middle" font-size="17" font-weight="800" fill="#14532d">ATP</text></g>
        </g>
        <g id="protLayer"></g>
        <g id="partLayer"></g>
        <g id="vCargo"></g>
      </svg>
    </div>
    <div id="status"></div>
    <div id="controls">
      <div class="seg">
        
        <button class="btn big" id="bPlay" type="button" aria-label="Play / Pause">⏸</button>
        
      </div>
      <button class="btn" id="bRestart" type="button">↻ <span data-i18n="restart">Restart</span></button>
      <button class="btn" id="bRemoveAll" type="button" data-i18n="removeAll">Remove all proteins</button>
      <button class="btn" id="bReset" type="button" data-i18n="resetSim">Reset simulation</button>
    </div>
  </main>

  <aside id="right">
    <div class="panel" id="toolPanel" style="overflow:visible">
      <h2 data-i18n="toolbox">Membrane proteins</h2>
      <div class="toolrow" id="toolRow"></div>
    </div>
    <div class="panel" id="chalPanel" style="display:none;overflow:visible"></div>
  </aside>

  <section id="monitor" aria-live="polite"></section>
</div>

<!-- Settings dialog -->
<div class="modal" id="mSet" role="dialog" aria-modal="true">
  <div class="dlg">
    <h2><span data-i18n="setTitle">Settings</span><button class="btn" id="setClose" type="button" data-i18n="close">Close</button></h2>
    <b data-i18n="setLang">Language</b>
    <div class="radios" id="langRadios">
      <button class="btn" data-l="en" type="button" data-i18n="langEn">English</button>
      <button class="btn" data-l="vi" type="button" data-i18n="langVi">Tiếng Việt</button>
      <button class="btn" data-l="custom" type="button" data-i18n="langCustom">Custom terminology</button>
    </div>
    <b data-i18n="setTerms">Terminology editor</b>
    <div class="note" data-i18n="setTermsHint"></div>
    <div class="terms" id="termsCore"></div>
    <details><summary data-i18n="setAdv">All other texts</summary><div class="terms" id="termsAdv"></div></details>
    <div class="radios">
      <button class="btn" id="setRestore" type="button" data-i18n="setRestore">Restore default terms</button>
      <button class="btn" id="setExport" type="button" data-i18n="setExport">Export settings (JSON)</button>
      <button class="btn" id="setImport" type="button" data-i18n="setImport">Import settings (JSON)</button>
      <label class="btn" style="display:inline-flex;align-items:center"><span data-i18n="setImportFile">Import from file</span><input type="file" id="setFile" accept=".json,application/json" style="display:none"></label>
    </div>
    <textarea id="setJson" spellcheck="false" aria-label="Settings JSON"></textarea>
    <div class="note" id="setMsg"></div>
  </div>
</div>

<!-- Learn dialog -->
<div class="modal" id="mInfo" role="dialog" aria-modal="true">
  <div class="dlg">
    <h2><span data-i18n="infoTitle">Learn</span><button class="btn" id="infoClose" type="button" data-i18n="close">Close</button></h2>
    <div class="tabs"><button class="btn on" id="tabFD" type="button" data-i18n="fd">Facilitated Diffusion</button><button class="btn" id="tabAT" type="button" data-i18n="at">Active Transport</button><button class="btn" id="tabVT" type="button" data-i18n="vt">Vesicular Transport</button></div>
    <ul id="infoList"></ul>
    <button class="btn" id="objBtn" type="button" data-i18n="showObj">Show Learning Objectives</button>
    <div class="obj" id="objBox" style="display:none"></div>
  </div>
</div>
<div id="home" role="dialog" aria-modal="true"><button class="btn" id="homeBack" type="button" data-i18n="close" style="display:none">Close</button><h2 id="homeTitle"></h2><div class="hcards" id="homeCards"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ======================================================================
   10. TERMINOLOGY MANAGEMENT  (one central dictionary – never hard-code text elsewhere)
   ====================================================================== */
const CORE=['membrane','ecf','cyto','na','k','atp','channel','pump','fd','at','grad','conf','high','low','pumpInactive','pumpActive','atpBind','waitAtp','energy','dir','eq'];
const I18N={
en:{

const STORE_KEY='membraneLab.settings.v2';
let lang='vi';
let custom=null;           // full custom dictionary or null
let langStamp=1;
function raw(key){
  const d=lang==='custom'?custom:I18N[lang];
  if(d&&typeof d[key]==='string'&&d[key]!=='')return d[key];
  return I18N.en[key]!==undefined?I18N.en[key]:key;
}
function t(key,vars,depth){
  depth=depth||0;const s=raw(key);if(depth>4)return s;
  return s.replace(/\{(\w+)\}/g,function(m,k){
    if(vars&&Object.prototype.hasOwnProperty.call(vars,k))return vars[k];
    if(I18N.en[k]!==undefined)return t(k,vars,depth+1);
    return m;
  });
}
/* ---- 11. SETTINGS PERSISTENCE ---- */
function saveSettings(){try{localStorage.setItem(STORE_KEY,JSON.stringify({lang:lang,custom:custom}));}catch(e){}}
function sanitizeCustom(obj){
  const o={};if(!obj||typeof obj!=='object')return null;
  Object.keys(I18N.en).forEach(function(k){if(typeof obj[k]==='string'&&obj[k].length<=400)o[k]=obj[k];});
  return Object.keys(o).length?o:null;
}
function loadSettings(){
  return;
  try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(s){custom=sanitizeCustom(s.custom);
      if(s.lang==='en'||s.lang==='vi')lang=s.lang;else if(s.lang==='custom'&&custom)lang='custom';}
  }catch(e){}
}

/* ======================================================================
   1. SIMULATION STATE  (single source of truth: particles + proteins)
   ====================================================================== */
const W=840,H=600,MY=300,HEAD_OUT=266,HEAD_IN=334,R=9,RA=11;
const SCALE=5;
const MAXP={na:40,k:40,atp:30,co2:40,o2:40};
const MODECFG={
 passive:{rows:[{g:'ecf',kind:'na',comp:'out'},{g:'ecf',kind:'co2',comp:'out'},{g:'ecf',kind:'o2',comp:'out'},{g:'cyto',kind:'na',comp:'in'},{g:'cyto',kind:'co2',comp:'in'},{g:'cyto',kind:'o2',comp:'in'}],
   defaults:{naOut:0,naIn:0,co2Out:0,co2In:0,o2Out:0,o2In:0},prot:'chan'},
 active:{rows:[{g:'ecf',kind:'na',comp:'out'},{g:'ecf',kind:'k',comp:'out'},{g:'cyto',kind:'na',comp:'in'},{g:'cyto',kind:'k',comp:'in'},{g:'cyto',kind:'atp',comp:'in'}],
   defaults:{naOut:30,naIn:8,kOut:8,kIn:30,atpIn:0},prot:'pump'},
 ves:{rows:[],defaults:{},prot:null}
};
let mode='passive';
const MODES={};
const PUMP_HALF=50,PUMP_W=36,CH_HALF=46,CH_W=30,PORE=14;
const MAX_PROT=1,MIN_GAP=110,X_MIN=120,X_MAX=780;
const NA_IN=[[-12,38],[0,24],[12,38]],NA_OUT=[[-12,-38],[0,-24],[12,-38]],K_OUT=[[-8,-34],[8,-34]],K_IN=[[-8,34],[8,34]],ATP_SITE=[46,54];
const ATTR=170;
let S=freshState();
let setp=Object.assign({},MODECFG.passive.defaults);   // student-chosen concentration set-points (used by Restart)
let running=true,speed=1;
let history=[],snapAcc=0;
let cap=null;
function freshState(name){const o={time:0,nextId:1,particles:[],proteins:[],ev:[],
  c:{naChanIn:0,naChanOut:0,naPumpOut:0,kPumpIn:0,atpConsumed:0,atpBind:0,e1e2:0,cycles:0,c1:0,noAtpT:0,noAtpT2:0}};if(name==='ves')o.v=vFresh();return o;}
const clamp=function(v,a,b){return v<a?a:v>b?b:v;};
const lerp=function(a,b,u){return a+(b-a)*u;};
const ease=function(u){u=clamp(u,0,1);return u*u*(3-2*u);};
const rnd=function(a,b){return a+Math.random()*(b-a);};

/* ======================================================================
   2. PARTICLE SYSTEM
   ====================================================================== */
function spawn(kind,comp){
  const r=kind==='atp'?RA:R;
  const lo=comp==='out'?r+4:HEAD_IN+r+6,hi=comp==='out'?HEAD_OUT-r-6:H-r-4;
  const a=Math.random()*6.283,sp=rnd(60,100);
  const p={id:S.nextId++,kind:kind,comp:comp,x:rnd(r+6,W-r-6),y:rnd(lo,hi),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,st:'free',owner:null,slot:0,t:0,fx:0,fy:0,cool:0};
  S.particles.push(p);return p;
}
function counts(){
  const c={naOut:0,naIn:0,kOut:0,kIn:0,atpIn:0,atpBound:0,co2Out:0,co2In:0,o2Out:0,o2In:0};
  for(let i=0;i<S.particles.length;i++){const p=S.particles[i];
    if(p.dead)continue;
    if(p.kind==='atp'){if(p.st==='free')c.atpIn++;else c.atpBound++;}
    else c[p.kind+(p.comp==='out'?'Out':'In')]++;
  }
  return c;
}
function keyOf(kind,comp){return kind==='atp'?'atpIn':kind+(comp==='out'?'Out':'In');}
function adjustTo(kind,comp,target){
  target=clamp(target,0,MAXP[kind]);
  let c=counts(),key=keyOf(kind,comp),guard=200;
  while(c[key]<target&&guard--){spawn(kind,comp);c=counts();}
  while(c[key]>target&&guard--){
    const free=S.particles.filter(function(p){return p.kind===kind&&p.comp===comp&&p.st==='free'&&!p.dead;});
    if(!free.length)break;
    const v=free[Math.floor(Math.random()*free.length)];S.particles.splice(S.particles.indexOf(v),1);c=counts();
  }
  return counts()[key];
}
function buildParticlesFromSetpoints(){
  S.particles=[];
  MODECFG[mode].rows.forEach(function(r){const n=setp[keyOf(r.kind,r.comp)]||0;for(let i=0;i<n;i++)spawn(r.kind,r.comp);});
}
function moveFree(p,dt){
  const k=300*dt;p.vx+=(Math.random()-.5)*k;p.vy+=(Math.random()-.5)*k;
  let sp=Math.hypot(p.vx,p.vy);const lo=55,hi=115;
  if(sp>hi){p.vx*=hi/sp;p.vy*=hi/sp;}
  else if(sp<lo){if(sp<1){const a=Math.random()*6.283;p.vx=Math.cos(a)*lo;p.vy=Math.sin(a)*lo;}else{p.vx*=lo/sp;p.vy*=lo/sp;}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;bounds(p);
}
function isGas(p){return p.kind==='co2'||p.kind==='o2';}
function bounds(p){
  const r=p.kind==='atp'?RA:R,minX=r+2,maxX=W-r-2;
  if(p.x<minX){p.x=minX;p.vx=Math.abs(p.vx);}if(p.x>maxX){p.x=maxX;p.vx=-Math.abs(p.vx);}
  if(isGas(p)){                       // small non-polar gases are free to cross the lipid bilayer
    if(p.y<r+2){p.y=r+2;p.vy=Math.abs(p.vy);}if(p.y>H-r-2){p.y=H-r-2;p.vy=-Math.abs(p.vy);}
    p.comp=p.y<MY?'out':'in';return;
  }
  const lo=p.comp==='out'?r+2:HEAD_IN+r+1,hi=p.comp==='out'?HEAD_OUT-r-1:H-r-2;
  if(p.y<lo){p.y=lo;p.vy=Math.abs(p.vy);}if(p.y>hi){p.y=hi;p.vy=-Math.abs(p.vy);}
}
/* proteins are solid: nothing crosses the bilayer or a protein body without a mechanism */
function collideProteins(p){
  const r=p.kind==='atp'?RA:R;
  for(let i=0;i<S.proteins.length;i++){
    const pr=S.proteins[i],hw=pr.type==='pump'?PUMP_W:CH_W,hh=pr.type==='pump'?PUMP_HALF:CH_HALF;
    const dx=p.x-pr.x;if(Math.abs(dx)>hw+r)continue;
    const pen=p.comp==='out'?(p.y+r)-(MY-hh):(MY+hh)-(p.y-r);
    if(pen<=0)continue;
    const side=hw+r-Math.abs(dx);
    if(pen<side){if(p.comp==='out'){p.y=MY-hh-r;p.vy=-Math.abs(p.vy);}else{p.y=MY+hh+r;p.vy=Math.abs(p.vy);}}
    else{const s=dx>=0?1:-1;p.x=pr.x+s*(hw+r);p.vx=s*Math.abs(p.vx);}
  }
}
function gasCollide(p){
  for(let i=0;i<S.proteins.length;i++){const pr=S.proteins[i];
    const dx=p.x-pr.x,dy=p.y-MY,ox=CH_W+R-Math.abs(dx),oy=CH_HALF+R-Math.abs(dy);
    if(ox>0&&oy>0){
      if(ox<oy){const sg=dx>=0?1:-1;p.x+=sg*ox;p.vx=sg*Math.abs(p.vx);}
      else{const sg=dy>=0?1:-1;p.y+=sg*oy;p.vy=sg*Math.abs(p.vy);}
    }
  }
}
function freeStep(p,dt){
  if(isGas(p)){moveFree(p,dt);gasCollide(p);return;}
  // gentle affinity toward binding sites that are currently "wanting" a particle (diffusion-limited binding speed-up)
  for(let i=0;i<S.proteins.length;i++){
    const pu=S.proteins[i];if(pu.type!=='pump')continue;
    let tx=null,ty=null;
    if(p.kind==='atp'&&pu.st==='idle'){tx=pu.x+ATP_SITE[0];ty=MY+ATP_SITE[1];}
    else if(p.kind==='na'&&p.comp==='in'&&pu.wantNa){tx=pu.x;ty=MY+58;}
    else if(p.kind==='k'&&p.comp==='out'&&pu.wantK){tx=pu.x;ty=MY-58;}
    if(tx===null)continue;
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    if(d<260&&d>1){p.vx+=dx/d*ATTR*dt;p.vy+=dy/d*ATTR*dt;}
  }
  if(p.kind==='na'&&p.cool<=0){            // weak funnel toward channel mouths (same on both sides, so the gradient still decides direction)
    for(let i=0;i<S.proteins.length;i++){const ch=S.proteins[i];if(ch.type!=='chan'||ch.busy)continue;
      const my=p.comp==='out'?MY-CH_HALF:MY+CH_HALF,dx=ch.x-p.x,dy=my-p.y,d=Math.hypot(dx,dy);
      if(d<170&&d>1){p.vx+=dx/d*55*dt;p.vy+=dy/d*55*dt;}}
  }
  moveFree(p,dt);
  if(p.cool>0)return;                       // freshly released particles pass through the open pore
  if(p.kind==='na'){                        // channel entry: Na+ only (selective), one ion at a time
    for(let i=0;i<S.proteins.length;i++){
      const ch=S.proteins[i];if(ch.type!=='chan'||ch.busy)continue;
      if(Math.abs(p.x-ch.x)<PORE){
        const Cc=S._C||counts();if((p.comp==='out'?Cc.naOut-Cc.naIn:Cc.naIn-Cc.naOut)<2)continue;   // facilitated diffusion only runs from the high-concentration side to the low one
        const reach=p.comp==='out'?(p.y+R>=MY-CH_HALF):(p.y-R<=MY+CH_HALF);
        if(reach){enterChannel(p,ch);return;}
      }
    }
  }
  collideProteins(p);
}

/* ======================================================================
   6. FACILITATED DIFFUSION MECHANICS
   ====================================================================== */
function enterChannel(p,ch){
  const C=S._C||counts();
  const cf=p.comp==='out'?C.naOut:C.naIn,ct=p.comp==='out'?C.naIn:C.naOut;
  p.good=cf>ct;ch.busy=p.id;p.st='transit';p.owner=ch.id;p.t=0;p.fx=p.x;p.fy=p.y;p.vx=0;p.vy=0;
}
function transitStep(p,dt){
  const ch=S.proteins.find(function(q){return q.id===p.owner;});
  if(!ch){p.st='free';p.owner=null;p.cool=0.4;return;}
  p.t+=dt/0.9;ch.glow=0.45;
  const dirIn=p.comp==='out',topY=MY-CH_HALF+2,botY=MY+CH_HALF-2;
  const aY=dirIn?topY:botY,bY=dirIn?botY:topY,exY=dirIn?MY+CH_HALF+R+4:MY-CH_HALF-R-4,u=p.t;
  if(u<0.17){const v=u/0.17;p.x=lerp(p.fx,ch.x,v);p.y=lerp(p.fy,aY,v);}
  else if(u<0.83){const v=(u-0.17)/0.66;p.x=ch.x;p.y=lerp(aY,bY,ease(v));}
  else if(u<1){const v=(u-0.83)/0.17;p.x=ch.x;p.y=lerp(bY,exY,v);}
  else{
    p.comp=dirIn?'in':'out';p.st='free';p.owner=null;p.cool=0.5;p.x=ch.x+rnd(-4,4);p.y=exY;p.vx=rnd(-20,20);p.vy=dirIn?80:-80;ch.busy=null;
    S.ev.push({t:S.time,k:'na',d:dirIn?1:-1,via:'chan'});
    if(dirIn)S.c.naChanIn++;else S.c.naChanOut++;
    if(p.good)S.c.c1++;
  }
}

/* ======================================================================
   7 & 8. ATP RANDOM MOVEMENT / BINDING  +  Na+/K+ PUMP MECHANICS
   ====================================================================== */
function ionPos(pu,q){
  if(q.kind==='na'){const a=NA_IN[q.slot],b=NA_OUT[q.slot],u=ease(pu.conf);return[pu.x+lerp(a[0],b[0],u),MY+lerp(a[1],b[1],u)];}
  const a=K_OUT[q.slot],b=K_IN[q.slot],u=ease(1-pu.conf);return[pu.x+lerp(a[0],b[0],u),MY+lerp(a[1],b[1],u)];
}
function releaseIon(pu,q){
  q.owner=null;q.st='free';q.cool=0.6;q.vx=rnd(-25,25);
  if(q.kind==='na'){q.comp='out';q.vy=-90;S.ev.push({t:S.time,k:'na',d:-1,via:'pump'});S.c.naPumpOut++;}
  else{q.comp='in';q.vy=90;S.ev.push({t:S.time,k:'k',d:1,via:'pump'});S.c.kPumpIn++;}
}
function pumpStep(pu,dt){
  const own=S.particles.filter(function(q){return q.owner===pu.id;});
  const naL=own.filter(function(q){return q.kind==='na';}),kL=own.filter(function(q){return q.kind==='k';});
  const atp=own.find(function(q){return q.kind==='atp';});
  pu.wantNa=false;pu.wantK=false;if(pu.fx>0)pu.fx-=dt;
  const x=pu.x;
  switch(pu.st){
  case 'idle':{                                   // E1, open to cytoplasm, waiting for ATP
    pu.conf=0;pu.dir=0;
    const sx=x+ATP_SITE[0],sy=MY+ATP_SITE[1];
    for(let i=0;i<S.particles.length;i++){const q=S.particles[i];
      if(q.kind!=='atp'||q.st!=='free'||q.cool>0||q.dead)continue;
      if(Math.hypot(q.x-sx,q.y-sy)<36){            // collision with the cytoplasmic ATP-binding site
        q.st='atpBinding';q.owner=pu.id;q.t=0;q.fx=q.x;q.fy=q.y;pu.st='atpBind';S.c.atpBind++;pu.fx=0.7;break;}
    }
    break;}
  case 'atpBind':{
    if(!atp){pu.st='idle';break;}
    atp.t+=dt/0.5;const u=Math.min(atp.t,1);
    atp.x=lerp(atp.fx,x+ATP_SITE[0],u);atp.y=lerp(atp.fy,MY+ATP_SITE[1],u);
    if(atp.t>=1){atp.st='atpBound';pu.st='naBind';pu.tm=0;pu.sg=false;pu.fx=0.7;setCaption('msgAtpBound',null,3000);}
    break;}
  case 'naBind':{
    pu.conf=0;pu.wantNa=naL.length<3;
    if(naL.length<3){
      for(let i=0;i<S.particles.length&&naL.length<3;i++){const q=S.particles[i];
        if(q.kind!=='na'||q.comp!=='in'||q.st!=='free'||q.cool>0)continue;
        if(Math.hypot(q.x-x,q.y-(MY+58))<40){q.st='bindNa';q.owner=pu.id;q.slot=naL.length;q.t=0;q.fx=q.x;q.fy=q.y;naL.push(q);}
      }
    }
    let arrived=0;
    naL.forEach(function(q){
      if(q.st==='bindNa'){q.t+=dt/0.35;const u=Math.min(q.t,1),s=NA_IN[q.slot];q.x=lerp(q.fx,x+s[0],u);q.y=lerp(q.fy,MY+s[1],u);if(q.t>=1)q.st='boundNa';}
      if(q.st==='boundNa')arrived++;
    });
    if(arrived>=3){
      if(!pu.sg){pu.sg=true;setCaption('msgNaBind',null,2500);}
      pu.tm+=dt;if(pu.tm>0.6){pu.st='toE2';pu.dir=1;pu.sg=false;}
    }
    break;}
  case 'toE2':{                                   // first conformational change E1 -> E2
    if(!pu.sg){pu.sg=true;setCaption('msgToE2',null,3000);}
    pu.conf=Math.min(1,pu.conf+dt/1.4);
    naL.forEach(function(q){if(q.st==='boundNa'){const p=ionPos(pu,q);q.x=p[0];q.y=p[1];}});
    if(pu.conf>=1){pu.st='naRelease';pu.tm=0;pu.rel=0;pu.sg=false;S.c.e1e2++;}
    break;}
  case 'naRelease':{                              // E2: release 3 Na+ outside
    pu.conf=1;pu.tm+=dt;
    while(pu.rel<3&&pu.tm>=0.15+pu.rel*0.4){
      const q=naL.find(function(z){return z.slot===pu.rel&&z.st==='boundNa';});
      if(q)releaseIon(pu,q);
      pu.rel++;
    }
    if(pu.rel>=3&&pu.tm>=1.5){setCaption('msgNaOut',null,2500);pu.st='kBind';pu.tm=0;pu.sg=false;}
    break;}
  case 'kBind':{                                  // E2: bind 2 K+ from the outside
    pu.conf=1;pu.wantK=kL.length<2;
    if(kL.length<2){
      for(let i=0;i<S.particles.length&&kL.length<2;i++){const q=S.particles[i];
        if(q.kind!=='k'||q.comp!=='out'||q.st!=='free'||q.cool>0)continue;
        if(Math.hypot(q.x-x,q.y-(MY-58))<40){q.st='bindK';q.owner=pu.id;q.slot=kL.length;q.t=0;q.fx=q.x;q.fy=q.y;kL.push(q);}
      }
    }
    let arrived=0;
    kL.forEach(function(q){
      if(q.st==='bindK'){q.t+=dt/0.35;const u=Math.min(q.t,1),s=K_OUT[q.slot];q.x=lerp(q.fx,x+s[0],u);q.y=lerp(q.fy,MY+s[1],u);if(q.t>=1)q.st='boundK';}
      if(q.st==='boundK')arrived++;
    });
    if(arrived>=2){
      if(!pu.sg){pu.sg=true;setCaption('msgKBind',null,2500);}
      pu.tm+=dt;if(pu.tm>0.6){pu.st='toE1';pu.dir=-1;pu.sg=false;}
    }
    break;}
  case 'toE1':{                                   // second conformational change E2 -> E1
    if(!pu.sg){pu.sg=true;setCaption('msgToE1',null,3000);}
    pu.conf=Math.max(0,pu.conf-dt/1.4);
    kL.forEach(function(q){if(q.st==='boundK'){const p=ionPos(pu,q);q.x=p[0];q.y=p[1];}});
    if(pu.conf<=0){pu.st='kRelease';pu.tm=0;pu.rel=0;pu.sg=false;}
    break;}
  case 'kRelease':{                               // E1: release 2 K+ into the cytoplasm
    pu.conf=0;pu.tm+=dt;
    while(pu.rel<2&&pu.tm>=0.15+pu.rel*0.4){
      const q=kL.find(function(z){return z.slot===pu.rel&&z.st==='boundK';});
      if(q){releaseIon(pu,q);if(pu.rel===0)setCaption('msgKIn',null,2500);}
      pu.rel++;
    }
    if(pu.rel>=2&&pu.tm>=1.1){
      if(atp){atp.dead=true;}                      // one ATP = one cycle; consumed, never reused
      S.c.atpConsumed++;S.c.cycles++;pu.st='done';pu.tm=0;setCaption('msgCycle',null,4500);
    }
    break;}
  case 'done':{pu.conf=0;pu.dir=0;pu.tm+=dt;if(pu.tm>2.5){pu.st='idle';}break;}
  }
}

/* ======================================================================

   ====================================================================== */
function tick(dt){
  S.time+=dt;S._C=counts();
  for(let i=0;i<S.particles.length;i++){const p=S.particles[i];
    if(p.cool>0)p.cool-=dt;
    if(p.st==='free')freeStep(p,dt);else if(p.st==='transit')transitStep(p,dt);
  }
  for(let i=0;i<S.proteins.length;i++){const pr=S.proteins[i];
    if(pr.type==='pump')pumpStep(pr,dt);else if(pr.glow>0)pr.glow-=dt;
  }
  if(S.particles.some(function(p){return p.dead;}))S.particles=S.particles.filter(function(p){return !p.dead;});
  if(S.ev.length&&S.time-S.ev[0].t>20)S.ev=S.ev.filter(function(e){return S.time-e.t<=20;});
  const C=counts();
  const idle=S.proteins.some(function(p){return p.type==='pump'&&p.st==='idle';});
  if(idle&&C.atpIn===0){S.c.noAtpT+=dt;if(S.c.cycles>=1)S.c.noAtpT2+=dt;}
}
function stepSim(dt){
  while(dt>1e-6){const h=Math.min(dt,1/30);
    if(mode==='ves')vTick(h);else{tick(h);snapAcc+=h;if(snapAcc>=0.5){snapAcc=0;pushSnap();}}
    dt-=h;}
}

  if(ok(x))return x;

function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;setGlow(false);

    d.ghost.remove();

/* ======================================================================
   VESICULAR TRANSPORT  – endocytosis / exocytosis drawn with a real phospholipid bilayer
   (every phospholipid = hydrophilic head + two hydrophobic tails; both leaflets bend together)
   ====================================================================== */
const VC=420,VR=45,VT=17,VNT=18,VHR=5,VTL=14,VK=34,VBRK=50;
const VDC=VR*(1+Math.sqrt(1-(VNT/VR)*(VNT/VR)));       // invagination depth at which the neck is as narrow as the tether
const VCY_BRK=MY-VR+VDC+VBRK;                           // centre of the vesicle at the moment of scission / docking
function vNeck(D){return Math.sqrt(Math.max(0,2*VR*D-D*D));}
function endoInit(){return{ph:'approach',t:0,D:0,L:0,x:VC-170,y:130,xf:0,y0:0};}
function exoInit(){
  const e={ph:'travel',t:0,D:VDC,L:VBRK,xf:0,vx:VC-230,vy:520,rel:0,relT:0,dots:[]};
  for(let i=0;i<5;i++){const a=i*1.2566+0.3,r=i?11:0;e.dots.push({rx:Math.cos(a)*r,ry:Math.sin(a)*r,vx:rnd(-20,20),vy:rnd(-20,20),st:'in',x:0,y:0,w:0});}
  return e;
}
function vFresh(){return{proc:'pino',pino:endoInit(),phago:endoInit(),exo:exoInit()};}

/* ---- phase machines (all motions are eased; nothing jumps) ---- */
function endoStep(e,dt){
  e.t+=dt;
  switch(e.ph){
  case 'approach':{const u=ease(e.t/3);e.x=lerp(VC-170,VC,u);e.y=lerp(130,MY-45,u)+Math.sin(e.t*3)*(1-u)*6;
    if(e.t>=3){e.ph='invag';e.t=0;e.x=VC;e.y=MY-45;}break;}
  case 'invag':{e.D=ease(e.t/7.5)*VDC;e.x=VC;e.y=MY-45+e.D;if(e.t>=7.5){e.D=VDC;e.ph='tube';e.t=0;}break;}
  case 'tube':{e.L=ease(e.t/1.8)*VBRK;e.y=MY-45+VDC+e.L;if(e.t>=1.8){e.L=VBRK;e.ph='split';e.t=0;}break;}
  case 'split':{e.xf=Math.min(1,e.t/0.5);e.x=VC;e.y=VCY_BRK;if(e.t>=0.5){e.xf=1;e.ph='sink';e.t=0;e.y0=VCY_BRK;}break;}
  case 'sink':{const u=ease(e.t/4);e.x=lerp(VC,VC+50,u);e.y=lerp(e.y0,e.y0+120,u);if(e.t>=4){e.ph='done';e.t=0;}break;}
  }
}
function exoCenter(e){return(e.ph==='travel'||e.ph==='dock')?[e.vx,e.vy]:[VC,MY-VR+e.D+e.L];}
function exoStep(e,dt){
  e.t+=dt;
  switch(e.ph){
  case 'travel':{const u=ease(e.t/4.5);e.vx=lerp(VC-230,VC,u);e.vy=lerp(520,VCY_BRK,u);if(e.t>=4.5){e.ph='dock';e.t=0;e.vx=VC;e.vy=VCY_BRK;}break;}
  case 'dock':if(e.t>=1.2){e.ph='fuse';e.t=0;}break;
  case 'fuse':{e.xf=Math.min(1,e.t/0.5);if(e.t>=0.5){e.ph='tube';e.t=0;e.xf=1;}break;}
  case 'tube':{e.L=VBRK*(1-ease(e.t/1.8));if(e.t>=1.8){e.L=0;e.ph='pore';e.t=0;}break;}
  case 'pore':{e.D=VDC*(1-ease(e.t/8));if(e.t>=8){e.D=0;e.ph='done';e.t=0;}break;}
  }
  const c=exoCenter(e);
  if(e.ph==='pore'&&vNeck(e.D)>=27){          // pore wide enough: cargo leaves one by one, only through the opening
    e.relT+=dt;
    while(e.rel<e.dots.length&&e.relT>=e.rel*0.4){const d=e.dots[e.rel];d.st='exit';d.w=0;e.rel++;}
  }
  e.dots.forEach(function(d){
    if(d.st==='in'){                           // confined inside the vesicle lumen until the pore is open
      d.vx+=(Math.random()-.5)*300*dt;d.vy+=(Math.random()-.5)*300*dt;
      const sp=Math.hypot(d.vx,d.vy);if(sp>40){d.vx*=40/sp;d.vy*=40/sp;}
      d.rx+=d.vx*dt;d.ry+=d.vy*dt;
      const r=Math.hypot(d.rx,d.ry),mx=VR-VT-VHR-6.5;if(r>mx){d.rx*=mx/r;d.ry*=mx/r;d.vx=-d.vx;d.vy=-d.vy;}
      d.x=c[0]+d.rx;d.y=c[1]+d.ry;
    }else if(d.st==='exit'){
      const wx=VC,wy=d.w===0?MY+22:MY-40,dx=wx-d.x,dy=wy-d.y,dist=Math.hypot(dx,dy),step=110*dt;
      if(dist<=step){d.x=wx;d.y=wy;if(d.w===0)d.w=1;else{d.st='free';d.vx=rnd(-40,40);d.vy=-60;}}
      else{d.x+=dx/dist*step;d.y+=dy/dist*step;}
    }else{
      d.vx+=(Math.random()-.5)*300*dt;d.vy+=(Math.random()-.5)*300*dt;
      const sp=Math.hypot(d.vx,d.vy);if(sp>80){d.vx*=80/sp;d.vy*=80/sp;}else if(sp<30&&sp>0){d.vx*=30/sp;d.vy*=30/sp;}
      d.x+=d.vx*dt;d.y+=d.vy*dt;
      if(d.x<10){d.x=10;d.vx=Math.abs(d.vx);}if(d.x>830){d.x=830;d.vx=-Math.abs(d.vx);}
      if(d.y<10){d.y=10;d.vy=Math.abs(d.vy);}const bm=MY-VT-VHR-8;if(d.y>bm){d.y=bm;d.vy=-Math.abs(d.vy);}
    }
  });
}
function vTick(dt){S.time+=dt;const v=S.v,e=v[v.proc];if(v.proc!=='exo')endoStep(e,dt);else exoStep(e,dt);}
function vReset(){const p=S.v.proc;S.v=vFresh();S.v.proc=p;S.time=0;}

/* ---- geometry: centre-line of the membrane, then two leaflets are laid on its two sides ---- */
function vBasePts(D,L){
  if(D<1&&L===0)return[[0,MY],[W,MY]];
  const tube=L>0,n=tube?VNT:vNeck(D),cy=MY-VR+D+L;
  const relY=tube?-Math.sqrt(VR*VR-VNT*VNT):(VR-D),beta=Math.atan2(relY,n),yj=cy+relY,pts=[];
  for(let x=0;x<VC-n-8;x+=24)pts.push([x,MY]);
  pts.push([VC-n,MY]);
  if(yj>MY+1)for(let y=MY+6;y<yj;y+=6)pts.push([VC-n,y]);
  const a0=Math.PI-beta,a1=beta,N=Math.max(24,Math.round(Math.abs(a0-a1)*VR/4));
  for(let k=0;k<=N;k++){const a=a0+(a1-a0)*k/N;pts.push([VC+VR*Math.cos(a),cy+VR*Math.sin(a)]);}
  if(yj>MY+1)for(let y=yj-6;y>MY;y-=6)pts.push([VC+n,y]);
  pts.push([VC+n,MY]);
  for(let x=VC+n+24;x<W-8;x+=24)pts.push([x,MY]);
  pts.push([W,MY]);
  return pts;
}
function vSmooth(p){
  for(let it=0;it<2;it++){const q=[p[0]];
    for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];q.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]);}
    q.push(p[p.length-1]);p=q;}
  return p;
}
function vf(n){return n.toFixed(1);}
function vLipid(x,y,cx,cy,hd,tl){          // (cx,cy) = unit vector from the head toward the middle of the bilayer
  hd.push('M'+vf(x-VHR)+' '+vf(y)+'a'+VHR+' '+VHR+' 0 1 0 '+(2*VHR)+' 0a'+VHR+' '+VHR+' 0 1 0 -'+(2*VHR)+' 0');
  const px=-cy,py=cx;
  for(let s=-1;s<=1;s+=2){const o=s*2.4;
    tl.push('M'+vf(x+cx*(VHR-0.5)+px*o)+' '+vf(y+cy*(VHR-0.5)+py*o)+'L'+vf(x+cx*(VTL+VHR*0.4)+px*o)+' '+vf(y+cy*(VTL+VHR*0.4)+py*o));}
}
function vLeaflet(p,sign,hd,tl){
  const n=p.length,nx=new Array(n),ny=new Array(n),ox=new Array(n),oy=new Array(n),cum=new Array(n);
  for(let i=0;i<n;i++){
    const a=p[i>0?i-1:0],b=p[i<n-1?i+1:n-1];let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    nx[i]=ty;ny[i]=-tx;ox[i]=p[i][0]+sign*VT*nx[i];oy[i]=p[i][1]+sign*VT*ny[i];
    cum[i]=i?cum[i-1]+Math.hypot(ox[i]-ox[i-1],oy[i]-oy[i-1]):0;
  }
  const Lt=cum[n-1],sp=Lt/2/VK;
  const put=function(s){
    let lo=0,hi=n-2;while(lo<hi){const m=(lo+hi+1)>>1;if(cum[m]<=s)lo=m;else hi=m-1;}
    const seg=(cum[lo+1]-cum[lo])||1,u=Math.min(1,Math.max(0,(s-cum[lo])/seg));
    const x=ox[lo]+(ox[lo+1]-ox[lo])*u,y=oy[lo]+(oy[lo+1]-oy[lo])*u;
    let ax=nx[lo]+(nx[lo+1]-nx[lo])*u,ay=ny[lo]+(ny[lo+1]-ny[lo])*u;const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;
    vLipid(x,y,-sign*ax,-sign*ay,hd,tl);
  };
  for(let k=0;k<=VK;k++)put(k*sp);
  for(let k=1;k<VK;k++)put(Lt-k*sp);
}
function vRing(cx,cy,hd,tl){                // a closed vesicle: two complete rings, heads facing the lumen and the cytoplasm
  const r1=VR+VT,n1=Math.round(2*Math.PI*r1/12.5),r2=VR-VT,n2=Math.round(2*Math.PI*r2/12.5);
  for(let k=0;k<n1;k++){const a=k*2*Math.PI/n1+0.1,ux=Math.cos(a),uy=Math.sin(a);vLipid(cx+ux*r1,cy+uy*r1,-ux,-uy,hd,tl);}
  for(let k=0;k<n2;k++){const a=k*2*Math.PI/n2,ux=Math.cos(a),uy=Math.sin(a);vLipid(cx+ux*r2,cy+uy*r2,ux,uy,hd,tl);}
}
function vSpecs(){

    switch(e.ph){
    case 'approach':return{A:{D:0,L:0,a:1},B:null};
    case 'invag':case 'tube':return{A:{D:e.D,L:e.L,a:1},B:null};
    case 'split':return{A:{D:VDC,L:VBRK,a:1-e.xf},B:{rings:[[VC,VCY_BRK]],a:e.xf}};
    default:return{A:null,B:{rings:[[e.x,e.y]],a:1}};
    }
  }
  switch(e.ph){
  case 'travel':case 'dock':return{A:null,B:{rings:[[e.vx,e.vy]],a:1}};
  case 'fuse':return{A:{D:VDC,L:VBRK,a:e.xf},B:{rings:[[VC,VCY_BRK]],a:1-e.xf}};
  case 'tube':case 'pore':return{A:{D:e.D,L:e.L,a:1},B:null};

  }
}
